  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg-primary:#000;
      --bg-secondary:#0a0a0a;
      --bg-card:rgba(20,20,20,.85);
      --text-primary:#fff;
      --text-secondary:#e0e0e0;
      --text-muted:#999;
      --accent-dim:rgba(255,255,255,.08);
      --border-subtle:rgba(255,255,255,.09);
      --glass-bg:rgba(10,10,10,.65);
      --glass-border:rgba(255,255,255,.12);
      --font-sans:'Inter',sans-serif;
      --font-display:'Orbitron',sans-serif;
      --shadow-color:rgba(0,0,0,.6);
      --logo-icon-filter:invert(0);
    }

    [data-theme="light"] {
      --bg-primary:#f5f5f5;
      --bg-secondary:#eee;
      --bg-card:rgba(255,255,255,.9);
      --text-primary:#111;
      --text-secondary:#333;
      --text-muted:#666;
      --accent-dim:rgba(0,0,0,.06);
      --border-subtle:rgba(0,0,0,.1);
      --glass-bg:rgba(255,255,255,.75);
      --glass-border:rgba(0,0,0,.12);
      --shadow-color:rgba(0,0,0,.13);
      --logo-icon-filter:invert(1);
    }

    html { scroll-behavior:smooth; scroll-padding-top:100px; }

    body {
      font-family:var(--font-sans);
      background:var(--bg-primary);
      color:var(--text-primary);
      line-height:1.7;
      overflow-x:hidden;
      transition:background .4s,color .3s;
      min-height:100vh;
    }

    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    img { max-width:100%; display:block; }

    .container {
      max-width:1200px;
      margin:auto;
      padding:0 24px;
      position:relative;
      z-index:2;
    }

    #particles-canvas {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
    }

    /* SHARED HEADER */

    .site-header {
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:1000;
      padding:14px 0;
      background:var(--glass-bg);
      border-bottom:1px solid var(--border-subtle);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:background .3s,border-color .3s,box-shadow .3s;
    }

    .header-inner {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo {
      font-family:var(--font-display);
      font-weight:900;
      font-size:22px;
      letter-spacing:3px;
      display:inline-flex;
      align-items:center;
      gap:12px;
    }

    .logo-img {
      width:46px;
      height:46px;
      object-fit:contain;
      display:inline-block;
      filter:var(--logo-icon-filter);
      transition:filter .3s ease;
    }

    .nav {
      display:flex;
      align-items:center;
      gap:26px;
    }

    .nav a {
      font-size:12px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--text-secondary);
      transition:color .25s;
      position:relative;
    }

    .nav a::after {
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:0;
      height:1px;
      background:var(--text-primary);
      transition:width .3s;
    }

    .nav a:hover { color:var(--text-primary); }
    .nav a:hover::after { width:100%; }

    .header-actions {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .theme-toggle {
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid var(--glass-border);
      background:transparent;
      color:var(--text-primary);
      font-size:14px;
      transition:background .25s,transform .25s;

    .theme-toggle:hover { background:var(--accent-dim); transform:rotate(15deg); }

    .mobile-toggle {

      width:38px;
      height:38px;

      border-radius:8px;

    .footer-col ul {
      list-style:none;

    .footer-col a {
      font-size:13px;

    .footer-contact-list li {

    .footer-contact-list li i {
      width:32px;

      display:grid;

      background:var(--bg-card);
      border:1px solid var(--border-subtle);
      font-size:13px;
      color:var(--text-secondary);
      flex-shrink:0;
    }

    .footer-contact-list a {
      color:var(--text-muted);

    }

    .footer-contact-list a:hover { color:var(--text-primary); }

    .footer-bottom {
      border-top:1px solid var(--border-subtle);

      justify-content:space-between;

    .footer-bottom-links {

    }

    .footer-bottom-links a {
      color:var(--text-muted);
      transition:color .25s;
    }

    .footer-bottom-links a:hover { color:var(--text-primary); }

    @media(max-width:1024px) {
      .footer-top { grid-template-columns:1fr 1fr; gap:40px; }
    }

    @media(max-width:650px) {
      .site-footer { padding:50px 0 0; }
      .footer-top { grid-template-columns:1fr; gap:36px; padding-bottom:40px; }
      .footer-bottom { justify-content:center; text-align:center; }
      .studio-hero { padding:120px 0 100px; }
      .studio-hero h1 { letter-spacing:-2px; }
      .logo { font-size:18px; }
      .logo-img { width:40px; height:40px; }
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        scroll-behavior:auto!important;
        animation:none!important;
        transition:none!important;
      }
    }
  </style>

<script>
/* ============================================================
   SHARED HEADER/FOOTER SCRIPT — HAR PAGE MEIN COPY KARO
   ============================================================ */
(function() {
  "use strict";

  /* THEME */
  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("tasawar-theme", theme);
    var icon = document.querySelector("#themeToggle i");
    if (icon) icon.className = theme === "light" ? "fas fa-sun" : "fas fa-moon";
  }
  setTheme(localStorage.getItem("tasawar-theme") || "dark");

  /* SHARED HEADER/FOOTER LOADER */
  async function loadComponent(templateId, targetSelector, sourcePage) {
    var target = document.querySelector(targetSelector);
    if (!target) return;

    var tpl = document.getElementById(templateId);
    if (tpl) {
      target.innerHTML = tpl.innerHTML;
      return;
    }

    try {
      var res = await fetch(sourcePage, { cache: "no-store" });
      var html = await res.text();
      var doc = new DOMParser().parseFromString(html, "text/html");
      var remote = doc.getElementById(templateId);
      if (remote) target.innerHTML = remote.innerHTML;
    } catch (e) {
      console.error("Component load failed:", templateId, e);
    }
  }

  /* HEADER EVENTS */
  function initHeaderEvents() {
    var themeToggle = document.getElementById("themeToggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function() {
        var cur = document.documentElement.getAttribute("data-theme");
        setTheme(cur === "light" ? "dark" : "light");
      });
    }

    var nav = document.getElementById("nav");
    var mt = document.getElementById("mobileToggle");
    if (nav && mt) {
      mt.addEventListener("click", function() {
        nav.classList.toggle("open");
        var icon = mt.querySelector("i");
        icon.className = nav.classList.contains("open") ? "fas fa-times" : "fas fa-bars";
      });
      nav.querySelectorAll("a").forEach(function(a) {
        a.addEventListener("click", function() {
          nav.classList.remove("open");
          mt.querySelector("i").className = "fas fa-bars";
        });
      });
    }

    var header = document.getElementById("siteHeader");
    if (header) {
      window.addEventListener("scroll", function() {
        header.style.boxShadow = window.scrollY > 20 ? "0 10px 30px rgba(0,0,0,.35)" : "none";
      }, { passive: true });
    }
  }

  /* PARTICLES */
  var canvas = document.getElementById("particles-canvas");
  var ctx = canvas ? canvas.getContext("2d") : null;
  var particles = [];
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    particles = Array.from({ length: 50 }, function() {
      return {
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        vx: (Math.random() - .5) * .25,
        vy: (Math.random() - .5) * .25,
        r: Math.random() * 1.2 + .3
      };
    });
  }

  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    var light = document.documentElement.dataset.theme === "light";
    var color = light ? "0,0,0" : "255,255,255";

    particles.forEach(function(p, i) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > innerWidth) p.vx *= -1;
      if (p.y < 0 || p.y > innerHeight) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + color + ",.35)";
      ctx.fill();
      for (var j = i + 1; j < particles.length; j++) {
        var q = particles[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = "rgba(" + color + "," + (.12 * (1 - d / 110)) + ")";
          ctx.lineWidth = .5;
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }

  /* BOOT */
  (async function boot() {
    await Promise.all([
      loadComponent("header-template", "#site-header", "/index.html"),
      loadComponent("footer-template", "#site-footer", "/index.html")
    ]);
    initHeaderEvents();
    if (canvas) {
      resize();
      window.addEventListener("resize", resize);
      if (!reduced) draw();
    }
    console.log("TΛSΛWΛR Studio | initialized");
  })();
})();
</script>
